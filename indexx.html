<!-- ✅ Rosary Bead Counter Bar -->
<div id="beadBar">
  <div id="beads">

    <!-- ✅ 10 Beads -->
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>
    <span class="bead"></span>

  </div>
</div>


<!-- ✅ Popup Counter Display -->
<div id="counterPopup">
  Beads: <span id="countNumber">0</span> / 10
</div>


<!-- ✅ FULL STYLE -->
<style>
  /* ✅ Bottom Bead Bar */
  #beadBar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: white;
    padding: 12px;
    display: flex;
    justify-content: center;
    border-top: 1px solid #ddd;
    z-index: 9999;
  }

  /* ✅ Beads Container */
  #beads {
    display: flex;
    gap: 10px;
  }

  /* ✅ Bead Style */
  .bead {
    width: 18px;
    height: 18px;
    background: #bbb;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.2s;
  }

  /* ✅ Completed Bead */
  .bead.active {
    background: black;
    transform: scale(1.15);
  }

  /* ✅ Popup Counter */
  #counterPopup {
    position: fixed;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    background: black;
    color: white;
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 15px;
    display: none;
    z-index: 9999;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
</style>


<!-- ✅ FULL SCRIPT -->
<script>
  let count = 0;

  const beads = document.querySelectorAll(".bead");
  const popup = document.getElementById("counterPopup");
  const countNumber = document.getElementById("countNumber");

  beads.forEach((bead) => {

    bead.addEventListener("click", () => {

      /* ✅ Vibration Tap Feedback */
      if ("vibrate" in navigator) {
        navigator.vibrate(40); // small tap vibration
      }

      /* ✅ Increase Count */
      count++;

      /* ✅ Activate Bead */
      bead.classList.add("active");

      /* ✅ Update Popup Counter */
      countNumber.textContent = count;

      /* ✅ Show Popup */
      popup.style.display = "block";

      /* ✅ Auto Hide Popup */
      setTimeout(() => {
        popup.style.display = "none";
      }, 1200);

      /* ✅ Reset After 10 Beads */
      if (count === 10) {

        /* ✅ Strong Completion Vibration */
        navigator.vibrate([120, 60, 120]);

        setTimeout(() => {
          beads.forEach(b => b.classList.remove("active"));
          count = 0;
          countNumber.textContent = count;
        }, 900);
      }

    });

  });
</script>
