<!-- ✅ Bottom Button -->
<button id="openCounterBtn">
  📿 Bead Counter
</button>


<!-- ✅ Full Popup Counter Screen -->
<div id="counterScreen">

  <!-- ✅ Close Button -->
  <button id="closeCounterBtn">✖</button>

  <!-- ✅ Big Circle Counter -->
  <div id="bigCounterCircle">
    <span id="bigCountText">0</span>
    <p>/ 10</p>
  </div>

  <!-- ✅ Hint Text -->
  <p id="tapHint">Tap the circle to count beads</p>

</div>


<!-- ✅ FULL STYLE -->
<style>
  /* ✅ Bigger Bottom Button */
  #openCounterBtn {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);

    padding: 18px 34px;      
    font-size: 18px;         
    font-weight: bold;

    border: none;
    border-radius: 40px;

    background: black;
    color: white;

    z-index: 9999;
    cursor: pointer;

    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  /* ✅ Popup Full Screen */
  #counterScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 10000;

    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  /* ✅ Close Button Top Right */
  #closeCounterBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 20px;
    padding: 10px 14px;
    border: none;
    border-radius: 50%;
    background: white;
    color: black;
    cursor: pointer;
  }

  /* ✅ Big Touch Circle */
  #bigCounterCircle {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: white;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    font-size: 70px;
    font-weight: bold;
    color: black;

    cursor: pointer;
    user-select: none;

    transition: 0.2s;
  }

  /* ✅ Tap Effect */
  #bigCounterCircle:active {
    transform: scale(0.94);
  }

  /* ✅ /10 Text */
  #bigCounterCircle p {
    font-size: 18px;
    margin: 0;
    opacity: 0.6;
  }

  /* ✅ Hint Text */
  #tapHint {
    margin-top: 25px;
    font-size: 15px;
    color: white;
    opacity: 0.75;
  }
</style>


<!-- ✅ FULL SCRIPT -->
<script>
  let count = 0;

  const openBtn = document.getElementById("openCounterBtn");
  const screen = document.getElementById("counterScreen");
  const closeBtn = document.getElementById("closeCounterBtn");

  const circle = document.getElementById("bigCounterCircle");
  const countText = document.getElementById("bigCountText");


  /* ✅ Open Counter Popup */
  openBtn.addEventListener("click", () => {
    screen.style.display = "flex";
  });


  /* ✅ Close Popup Manually */
  closeBtn.addEventListener("click", () => {
    screen.style.display = "none";
  });


  /* ✅ Tap Circle to Count Beads */
  circle.addEventListener("click", () => {

    /* ✅ Vibration Tap Feedback */
    if ("vibrate" in navigator) {
      navigator.vibrate(55);
    }

    /* ✅ Increase Count */
    count++;
    countText.textContent = count;


    /* ✅ Auto Close After 10 */
    if (count === 10) {

      /* ✅ Strong Completion Vibration */
      navigator.vibrate([150, 70, 150]);

      setTimeout(() => {

        /* ✅ Close Popup */
        screen.style.display = "none";

        /* ✅ Reset Counter */
        count = 0;
        countText.textContent = count;

      }, 700);
    }

  });
</script>
